name: valuation
on: [push, pull_request]
jobs:
  offline-valuation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest beanprice/sync_test.py beanprice/sources/valuation_test.py beanprice/sources/eastmoneystock_test.py beanprice/sources/eastmoneyfund_test.py beanprice/sources/ecbrates_test.py
